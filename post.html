<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background:#0f1115;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}
.container{margin-top:20px}

/* ===== HERO ===== */
.hero{
  position:relative;
  height:50vh;
  min-height:280px;
  border-radius:16px;
  overflow:hidden;
}
.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  transform:scale(1.05);
}
.hero-bg.has-img{filter:blur(2px) brightness(.75)}
.hero-vignette{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.9));
}
.hero-poster{
  position:relative;
  bottom:-80px;
  left:24px;
  width:220px;
  border-radius:14px;
  box-shadow:0 30px 60px rgba(0,0,0,.7);
  z-index:5;
}
.hero-text{
  position:absolute;
  bottom:24px;
  left:270px;
  right:20px;
  z-index:5;
}

@media(max-width:768px){
  .hero{height:auto;padding:16px}
  .hero-poster{
    position:relative;
    bottom:0;
    left:0;
    margin:0 auto 12px;
    width:180px;
    display:block;
  }
  .hero-text{
    position:relative;
    text-align:center;
    left:0;
    bottom:0;
  }
}

/* ===== CONTENT ===== */
.content{margin-top:120px}
@media(max-width:768px){.content{margin-top:20px}}

.info-box{
  background:linear-gradient(to right,#3f4c6b,#606c88);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  font-size:14px;
}

/* ===== DIRECTOR ===== */
.director-box{
  display:flex;
  align-items:center;
  gap:12px;
}
.director-box img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

/* ===== CAST ===== */
.cast-carousel{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:10px 4px 14px;
}
.cast-item{
  width:80px;
  text-align:center;
  font-size:11px;
}
.cast-item img{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  margin-bottom:6px;
}

/* ===== VIDEO ===== */
video{
  width:100%;
  border-radius:12px;
  margin-top:12px;
  background:#000;
}

.torrent-player{
  width:100%;
  aspect-ratio:16/9;
  margin-top:12px;
  border-radius:12px;
  overflow:hidden;
  background:#000;
}

.torrent-player > div{
  width:100%;
  height:100%;
}

.btn-grad{
  background-image:linear-gradient(to right,#757F9A,#D7DDE8,#757F9A);
  padding:10px 28px;
  margin:6px;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  display:inline-block;
  font-size:13px;
}
</style>
</head>

<body>

<main class="container">
  <div id="movie-container"></div>
</main>

<script
  src="https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js"
  charset="utf-8"
  async>
</script>

<script>
/* ================= CONFIG ================= */
const TMDB_API_KEY = "532a88c1ce983a87d6b28e49ad40a68e";
const TMDB_BASE = "https://api.themoviedb.org/3";
const TMDB_IMG  = "https://image.tmdb.org/t/p";
const CACHE_TTL = 1000 * 60 * 60 * 24;

const params = new URLSearchParams(location.search);
const id = parseInt(params.get("id"));
const POSTS_JSON_URL = "posts.json";
const container = document.getElementById("movie-container");

/* ================= CACHE ================= */
function cacheGet(key){
  const raw = localStorage.getItem(key);
  if(!raw) return null;
  const obj = JSON.parse(raw);
  if(Date.now() - obj.time > CACHE_TTL){
    localStorage.removeItem(key);
    return null;
  }
  return obj.data;
}
function cacheSet(key,data){
  localStorage.setItem(key, JSON.stringify({time:Date.now(), data}));
}

/* ================= HELPERS ================= */
async function fetchPosts(){
  const r = await fetch(POSTS_JSON_URL);
  return (await r.json()).filter(p => p.heading || p.tmdbid);
}

/* ===== TMDB MOVIE (ID → TITLE FALLBACK) ===== */
async function fetchTMDBSmart(post){
  const cacheKey = "tmdb_movie_" + (post.tmdbid || post.heading);
  const cached = cacheGet(cacheKey);
  if(cached) return cached;

  let movie = null;

  if(post.tmdbid){
    const r = await fetch(`${TMDB_BASE}/movie/${post.tmdbid}?api_key=${TMDB_API_KEY}`);
    if(r.ok) movie = await r.json();
  }

  if(!movie && post.heading){
    const r = await fetch(
      `${TMDB_BASE}/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(post.heading)}`
    );
    const d = await r.json();
    movie = d.results?.[0] || null;
  }

  if(movie) cacheSet(cacheKey, movie);
  return movie;
}

async function fetchCredits(id){
  if(!id) return null;
  const cacheKey = "tmdb_credits_" + id;
  const cached = cacheGet(cacheKey);
  if(cached) return cached;

  const r = await fetch(`${TMDB_BASE}/movie/${id}/credits?api_key=${TMDB_API_KEY}`);
  if(!r.ok) return null;
  const data = await r.json();
  cacheSet(cacheKey, data);
  return data;
}


/* ================= PLAYER =================
   Webtor player integration.
   For torrent sources Webtor's Player SDK watches the
   <video> element's magnet src, matching the documented
   integration style.
*/
function createTorrentPlayer(magnet,dataPath=""){
  const video=document.getElementById("torrent-video");
  if(!video || !magnet)return;

  // Match the working Webtor compiler structure:
  // <video controls src="magnet:..." data-path="..."></video>
  video.setAttribute("src", magnet);

  if(dataPath){
    video.setAttribute("data-path", dataPath);
  }

  // Do not manually instantiate Webtor.Player.
  // The embed SDK detects the video element automatically.
}

/* ================= INIT ================= */
(async()=>{
  try{
    const res=await fetch(POSTS_JSON_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("posts.json HTTP "+res.status);

    const posts=(await res.json()).filter(p=>p.heading||p.tmdbid);
    const post=posts.find(p=>+p.id===id);

    if(!post){
      container.innerHTML="<h3>Movie not found</h3>";
      return;
    }

    // Render immediately from JSON; TMDB is optional enrichment.
    const title=post.heading||"Untitled";
    const year=post.year||"";
    const poster=post.poster||"";
    const backdrop=post.backdrop||poster;
    const plot=post.plot||"";

    container.innerHTML=`
      <div class="hero">
        <div class="hero-bg ${backdrop?'has-img':''}" style="background-image:url('${backdrop}')"></div>
        <div class="hero-vignette"></div>
        ${poster?`<img src="${poster}" class="hero-poster">`:""}
        <div class="hero-text">
          <h4>${title} ${year?`(${year})`:""}</h4>
        </div>
      </div>

      <div class="content">
        <div class="info-box">
          <strong>Director:</strong>
          <div class="director-box mt-2">
            <div>${post.director||"N/A"}</div>
          </div>
        </div>

        ${plot?`<div class="info-box"><strong>Plot:</strong> ${plot}</div>`:""}

        ${post.magnet?`
          <div class="torrent-player">
            <video
              id="torrent-video"
              controls
              playsinline
              preload="metadata"
              data-path="">
            </video>
          </div>
        `:post.videoUrl?`
          <video controls playsinline preload="metadata">
            <source src="${post.videoUrl}">
            Your browser does not support this video.
          </video>
        `:`
          <div class="info-box mt-3">No video source is configured for this title.</div>
        `}

        <div class="btn-wrap">
          ${post.videoUrl?`<a href="${post.videoUrl}" class="btn-grad" target="_blank" rel="noopener">Open Video</a>`:""}
          <a href="index.html" class="btn-grad">Back</a>
        </div>
      </div>
    `;

    if(post.magnet){
      createTorrentPlayer(post.magnet,post.dataPath||"");
    }

    // Optional TMDB enrichment; never blocks initial page rendering.
    if(post.tmdbid){
      try{
        const movie=await Promise.race([
          fetchTMDBSmart(post),
          new Promise((_,reject)=>setTimeout(()=>reject(new Error("TMDB timeout")),7000))
        ]);

        if(movie){
          const titleEl=container.querySelector(".hero-text h4");
          if(titleEl){
            const tmdbYear=movie.release_date?.slice(0,4)||year;
            titleEl.textContent=`${title} ${tmdbYear?`(${tmdbYear})`:""}`;
          }

          if(movie.backdrop_path){
            const bg=container.querySelector(".hero-bg");
            if(bg) bg.style.backgroundImage=
              `url('${TMDB_IMG}/w1280${movie.backdrop_path}')`;
          }
        }
      }catch(e){
        console.warn("TMDB enrichment skipped:",e);
      }
    }

  }catch(err){
    console.error("Post page error:",err);
    container.innerHTML=`
      <div class="info-box">
        <h3>Unable to load movie</h3>
        <p>${err.message||"Unknown error"}</p>
      </div>
      <a href="index.html" class="btn-grad">Back</a>`;
  }
})();
</script>

</body>
</html>
